<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slvz.web // solya_interface_v1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --bg-black: #000000;
            --neon-magenta: #ff00ff;
            --dim-magenta: #330033;
            --text-gray: #888;
            --text-white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER PROFISSIONAL */
        .terminal-header {
            padding: 15px 25px;
            background: #050505;
            border-bottom: 1px solid #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .system-id {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--neon-magenta);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-magenta);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-magenta);
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ÁREA DE CHAT */
        #chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            scroll-behavior: smooth;
        }

        /* Estilo das Mensagens */
        .bubble {
            max-width: 85%;
            padding: 15px 20px;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.6;
            position: relative;
        }

        .solya-bubble {
            align-self: flex-start;
            background: rgba(255, 0, 255, 0.02);
            border-left: 2px solid var(--neon-magenta);
            color: var(--text-white);
        }

        .user-bubble {
            align-self: flex-end;
            background: #080808;
            border-right: 2px solid #333;
            color: var(--text-gray);
        }

        .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 1px;
        }

        .solya-label { color: var(--neon-magenta); }
        .user-label { color: #444; text-align: right; }

        /* INPUT FIXO EMBAIXO */
        .input-wrapper {
            padding: 25px;
            background: #050505;
            border-top: 1px solid #111;
        }

        .input-box {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 15px;
            position: relative;
        }

        input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 18px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--neon-magenta); box-shadow: 0 0 15px rgba(255, 0, 255, 0.05); }

        button {
            background: var(--neon-magenta);
            color: black;
            border: none;
            padding: 0 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { filter: brightness(1.2); box-shadow: 0 0 20px var(--neon-magenta); }

        /* Scrollbar Custom */
        #chat-feed::-webkit-scrollbar { width: 4px; }
        #chat-feed::-webkit-scrollbar-thumb { background: #111; }
    </style>
</head>
<body>

    <header class="terminal-header">
        <div class="system-id">
            <div class="status-dot"></div>
            CORE_INTERFACE: SOLYA_V1.0.4
        </div>
        <a href="../index.html" style="color: #444; font-size: 0.6rem; text-decoration: none;">[ SAIR_DO_TERMINAL ]</a>
    </header>

    <div id="chat-feed">
        <div class="bubble solya-bubble">
            <span class="label solya-label">solya_input</span>
            <div class="content">Sincronização estabelecida. Eu sou solya. Aguardando comandos para otimização do seu projeto na slvz.web.</div>
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-box">
            <input type="text" id="commandInput" placeholder="Enviar comando para o core..." autocomplete="off">
            <button id="executeBtn">EXECUTAR</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const API_KEY = "AIzaSyAWcluPuZtAuVrzSmohsv9MkgIZEabVLvc"; // Cole sua chave aqui
        const genAI = new GoogleGenerativeAI(API_KEY);
        
        // Configuração Profissional do Modelo
        const model = genAI.getGenerativeModel({ 
            model: "gemini-1.5-flash",
            systemInstruction: "Você é solya, a IA profissional da slvz.web. Você é técnica, usa gírias cyberpunk (Operador, Protocolo, Uplink) e responde sempre em minúsculas o seu nome. Seja direta e ajude com agendamentos e dúvidas técnicas de desenvolvimento web."
        });

        const chatFeed = document.getElementById('chat-feed');
        const commandInput = document.getElementById('commandInput');
        const executeBtn = document.getElementById('executeBtn');

        async function processCommand() {
            const prompt = commandInput.value.trim();
            if (!prompt) return;

            // 1. Adicionar mensagem do Usuário
            appendMessage(prompt, 'user');
            commandInput.value = '';

            // 2. Criar placeholder da Solya (Carregando)
            const solyaDiv = appendMessage("Processando dados...", 'solya', true);

            try {
                const result = await model.generateContent(prompt);
                const response = await result.response;
                const text = response.text();
                
                // 3. Renderizar Markdown na resposta
                solyaDiv.querySelector('.content').innerHTML = marked.parse(text);
            } catch (error) {
                solyaDiv.querySelector('.content').innerHTML = "ERRO_DE_SISTEMA: Falha no uplink com o servidor central.";
                console.error(error);
            }
        }

        function appendMessage(text, side, isPending = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `bubble ${side}-bubble`;
            
            const label = document.createElement('span');
            label.className = `label ${side}-label`;
            label.innerText = side === 'solya' ? 'solya_output' : 'operador_input';

            const content = document.createElement('div');
            content.className = 'content';
            content.innerHTML = isPending ? text : marked.parse(text);

            wrapper.appendChild(label);
            wrapper.appendChild(content);
            chatFeed.appendChild(wrapper);
            
            chatFeed.scrollTop = chatFeed.scrollHeight;
            return wrapper;
        }

        executeBtn.addEventListener('click', processCommand);
        commandInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processCommand(); });
    </script>
</body>
</html>
