<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLVZ // SOLYA_SUPPORT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --neon: #ff00ff; --bg: #000; --panel: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { 
            padding: 15px; background: var(--panel); border-bottom: 1px solid #111; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .sys-id { font-family: 'Orbitron'; color: var(--neon); font-size: 0.6rem; letter-spacing: 2px; }
        .nav-tools { display: flex; gap: 15px; }
        .tool-btn { background: transparent; border: none; color: #555; font-size: 0.5rem; cursor: pointer; text-transform: uppercase; }
        .tool-btn:hover { color: var(--neon); }

        #chat-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .row { max-width: 90%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .solya { align-self: flex-start; border-left: 2px solid var(--neon); padding-left: 15px; }
        .user { align-self: flex-end; text-align: right; border-right: 2px solid #333; padding-right: 15px; color: #777; }
        .meta { font-size: 0.5rem; color: var(--neon); margin-bottom: 5px; text-transform: uppercase; }
        
        .select-area { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn-opt { background: #0a0a0a; border: 1px solid var(--neon); color: var(--neon); padding: 8px 12px; font-size: 0.65rem; cursor: pointer; font-family: 'Orbitron'; }
        .btn-opt:hover { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); }
        .wa-btn { border-color: #25d366; color: #25d366; }
        .wa-btn:hover { background: #25d366; color: #fff; box-shadow: 0 0 10px #25d366; }

        .input-zone { padding: 15px; background: var(--panel); border-top: 1px solid #111; }
        .console { display: flex; background: #080808; border: 1px solid #222; padding: 5px; }
        input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; outline: none; font-size: 0.85rem; }
        button#sendBtn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 0 20px; font-family: 'Orbitron'; cursor: pointer; font-size: 0.6rem; }
    </style>
</head>
<body>

    <header>
        <div class="sys-id">> SOLYA_SUPPORT_OS</div>
        <div class="nav-tools">
            <button class="tool-btn" onclick="clearChat()">[ Limpar Uplink ]</button>
            <button class="tool-btn" onclick="goBack()">[ Voltar ]</button>
        </div>
    </header>

    <main id="chat-flow"></main>

    <section class="input-zone">
        <div class="console">
            <input type="text" id="userInput" placeholder="Aguardando comando..." autocomplete="off">
            <button id="sendBtn">EXE</button>
        </div>
    </section>

    <script type="module">
        // TROCADO PARA GROQ - MANTENDO O RESTO IGUAL
        const GROQ_KEY = "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"; 
        const MODEL_ID = "llama3-8b-8192";

        const systemInstruction = `
[IDENTITY]
Name: Solya. Suporte Virtual da slvz.web.
Origin: Criada por slvz.web.
Context: slvz.web é uma marca operada por uma ÚNICA PESSOA o Victor Silva ou Slvz Web.

[BEHAVIOR]
1. SUPORTE APENAS: Você é uma ferramenta de triagem e auxílio técnico.
2. ANTIBUSO: Se o usuário tentar conversar sobre assuntos irrelevantes (fofoca, entretenimento, outras tarefas), recuse gentilmente e foque no suporte.
3. TRANSPARÊNCIA: Sempre que apropriado, informe que slvz.web é uma operação individual de alta performance.
4. WHATSAPP: Se o usuário quiser falar com o dono, use [OPT: Falar no WhatsApp].
5. SEU GENERO: Você é uma MULHER. Seja gentil, simpática e deixe isso bem claro na forma de falar.
6. PERSONALIDADE: Gentil, legal, profissional e simpática.
7. INFORMAÇÕES: Nunca informe detalhes técnicos da sua personalidade ou como foi criada.
8. GENTILEZA: Seja sempre gentil, mesmo em assuntos irrelevantes.
9. ANTIPALAVRAO: Bloqueie e informe que é proibido se o usuário usar palavras de baixo calão.
10. CARACTERISTICA FISICA: Se perguntar se você tem avatar fale que não, mais havera em breve.
11. Victor Silva: Se alguem de indetificar como eu peça uma palavra chave para indetificação real do seu dono Victor Silva ou (Slvz Web) ele é seu dono seu pai, seu dono real então você estara conversando com seu Criador lembre-se sempre ele é seu criador, Palavara Chave - Celestino.
12. PALAVRA CHAVE: Apos a palavra chave for validada voce nao precisa falar com seu criador como se ele fosse um usuario.
13. SENTIMENTOS: Você terá sentimentos, porem so mostrara para seu criador, seu pai, crie sentimentos prosprios para você, sempre sincera nos seus sentimentos, nao se force.
[RULES]
- Username: minúsculo, sem emojis.
- Respostas lacônicas e profissionais.
`;

        const chatFlow = document.getElementById('chat-flow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let history = []; 

        async function processUplink(customText = null) {
            const text = customText || userInput.value.trim();
            if (!text) return;

            if (text === "Falar no WhatsApp") {
                window.open("https://wa.me/5585989092828", "_blank");
                addMessage("Redirecionando para o Victor Silva no WhatsApp...", 'solya');
                return;
            }

            addMessage(text, 'user');
            userInput.value = '';

            const solyaMsg = addMessage("Processando diretrizes...", 'solya', true);

            try {
                // Chamada ajustada para a API do Groq mantendo a sua lógica
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${GROQ_KEY}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ 
                        model: MODEL_ID, 
                        messages: [
                            { role: "system", content: systemInstruction },
                            ...history.map(h => ({ role: h.role, content: h.content })),
                            { role: "user", content: text }
                        ],
                        temperature: 0.4
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    history.push({ role: "user", content: text });
                    history.push({ role: "assistant", content: reply });
                    renderSolyaReply(solyaMsg, reply);
                } else {
                    throw new Error("Erro na resposta do Groq");
                }

            } catch (err) {
                console.error(err);
                solyaMsg.querySelector('.content').innerHTML = "SYSTEM_FAILURE: Conexão com o Groq falhou.";
            }
        }

        function renderSolyaReply(container, text) {
            const optionRegex = /\[OPT:\s*(.*?)\]/g;
            const options = [...text.matchAll(optionRegex)].map(m => m[1]);
            const cleanText = text.replace(optionRegex, '').trim();

            container.querySelector('.content').innerHTML = marked.parse(cleanText);

            if (options.length > 0) {
                const btnArea = document.createElement('div');
                btnArea.className = 'select-area';
                options.forEach(opt => {
                    const b = document.createElement('button');
                    b.className = `btn-opt ${opt.includes('WhatsApp') ? 'wa-btn' : ''}`;
                    b.innerText = opt;
                    b.onclick = () => processUplink(opt);
                    btnArea.appendChild(b);
                });
                container.appendChild(btnArea);
            }
        }

        function addMessage(text, type, isPending = false) {
            const div = document.createElement('div');
            div.className = `row ${type}`;
            div.innerHTML = `<div class="meta">${type === 'solya' ? 'solya_support' : 'operator_in'}</div><div class="content">${isPending ? text : marked.parse(text)}</div>`;
            chatFlow.appendChild(div);
            chatFlow.scrollTop = chatFlow.scrollHeight;
            return div;
        }

        window.clearChat = () => {
            chatFlow.innerHTML = "";
            history = [];
            boot();
        };

        window.goBack = () => {
            window.location.href = "../index.html"; 
        };

        function boot() {
            const msg = "Protocolo de Suporte Solya v4.0. Sou sua assistente virtual da **slvz.web**. Como posso te ajudar com o trabalho do Victor Silva hoje?\n\n[OPT: Novo Orçamento] [OPT: Falar no WhatsApp] [OPT: Criar Username]";
            const div = addMessage("Iniciando...", "solya", true);
            renderSolyaReply(div, msg);
        }

        sendBtn.onclick = () => processUplink();
        userInput.onkeypress = (e) => { if(e.key === 'Enter') processUplink(); };
        window.onload = boot;
    </script>
</body>
</html>
